name: Deploy Track to ECS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('track-release-check-{0}', github.event.pull_request.number) || 'track-production-release' }}
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install boto3==1.43.61 pytest==9.1.1
      - run: python -m pytest tests/test_release_orchestration.py -q
  deploy:
    needs: validate-release
    if: github.ref == 'refs/heads/main' && github.repository == 'mtmlx/track'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::525753067477:role/TrackGitHubDeployRole
          aws-region: us-east-2
          role-duration-seconds: 7200
          allowed-account-ids: '525753067477'
      - name: Install release tooling
        run: python -m pip install boto3==1.43.61
      - name: Build, validate and deploy the reviewed commit
        run: python deploy/aws-ecs/release/release.py
        env:
          RELEASE_SHA: ${{ github.sha }}
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: track-release-${{ github.sha }}-${{ github.run_id }}
          path: release-evidence/
          retention-days: 90
          if-no-files-found: warn
