services:
  - type: web
    name: shipment-api
    runtime: docker
    plan: starter
    repo: https://github.com/mtmlx/track
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: shipment-api
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: SHIPMENT_API_HOST
        value: 0.0.0.0
      - key: SHIPMENT_API_TRIGGER_TOKEN
        generateValue: true
      - key: SHIPMENT_PREFLIGHT_ENABLED
        value: "true"
      - key: SHIPMENT_MIN_SYNC_INTERVAL_HOURS
        value: "0"
      - key: CLICKUP_DISCOVER_LISTS_FROM_SPACES
        value: "true"
      - key: MAERSK_API_MODE
        value: events
      - key: MAERSK_TRACKING_API_URL
        value: https://api.maersk.com/track-and-trace-private/events
      - key: MAERSK_TRACKING_URL_TEMPLATE
        value: ""
      - key: MAERSK_CONSUMER_KEY
        sync: false
      - key: MAERSK_OAUTH_TOKEN_URL
        value: https://api.maersk.com/oauth2/access_token
      - key: MAERSK_OAUTH_CLIENT_ID
        sync: false
      - key: MAERSK_OAUTH_CLIENT_SECRET
        sync: false
      - key: MAERSK_OAUTH_SCOPE
        value: ""
      - key: MAERSK_API_VERSION
        value: "1"
      - key: MAERSK_EVENTS_LIMIT
        value: "100"
      - key: MAERSK_FETCH_ALL_EVENTS
        value: "true"
      - key: MAERSK_WEB_FALLBACK_ON_API_ERROR
        value: "false"
      - key: MAERSK_TIMEOUT_SECONDS
        value: "60"
      - key: MAERSK_MAX_RETRIES
        value: "2"
      - key: MAERSK_RETRY_DELAY_SECONDS
        value: "2"
      - key: MSC_USE_PLAYWRIGHT
        value: "true"
      - key: MSC_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: MSC_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: MSC_PLAYWRIGHT_CHANNEL
        value: ""
      - key: MSC_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_USE_PLAYWRIGHT
        value: "true"
      - key: HAPAG_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: HAPAG_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: HAPAG_PLAYWRIGHT_CHANNEL
        value: ""
      - key: HAPAG_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_PLAYWRIGHT_VIEW
        value: "S8510"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_TIMEOUT_SECONDS
        value: "45"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_RELOAD_ATTEMPTS
        value: "2"
      - key: HAPAG_PLAYWRIGHT_WARMUP_SECONDS
        value: "6"
      - key: WAN_HAI_USE_PLAYWRIGHT
        value: "true"
      - key: WAN_HAI_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: WAN_HAI_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: WAN_HAI_PLAYWRIGHT_CHANNEL
        value: ""
      - key: WAN_HAI_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: CMA_CGM_USE_PLAYWRIGHT
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: CMA_CGM_PLAYWRIGHT_CHANNEL
        value: ""
      - key: CMA_CGM_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_WARMUP_URL
        value: https://www.cma-cgm.com/ebusiness/tracking
      - key: CMA_CGM_PLAYWRIGHT_WAIT_SECONDS
        value: "8"

  - type: cron
    name: track-trace-cron
    runtime: docker
    plan: starter
    repo: https://github.com/mtmlx/track
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 */8 * * *"
    dockerCommand: ./scripts/run_sync.sh
    envVars:
      - key: SHIPMENT_PREFLIGHT_ENABLED
        value: "true"
      - key: SHIPMENT_MIN_SYNC_INTERVAL_HOURS
        value: "0"
      - key: CLICKUP_DISCOVER_LISTS_FROM_SPACES
        value: "true"
      - key: MAERSK_API_MODE
        value: events
      - key: MAERSK_TRACKING_API_URL
        value: https://api.maersk.com/track-and-trace-private/events
      - key: MAERSK_TRACKING_URL_TEMPLATE
        value: ""
      - key: MAERSK_CONSUMER_KEY
        sync: false
      - key: MAERSK_OAUTH_TOKEN_URL
        value: https://api.maersk.com/oauth2/access_token
      - key: MAERSK_OAUTH_CLIENT_ID
        sync: false
      - key: MAERSK_OAUTH_CLIENT_SECRET
        sync: false
      - key: MAERSK_OAUTH_SCOPE
        value: ""
      - key: MAERSK_API_VERSION
        value: "1"
      - key: MAERSK_EVENTS_LIMIT
        value: "100"
      - key: MAERSK_FETCH_ALL_EVENTS
        value: "true"
      - key: MAERSK_WEB_FALLBACK_ON_API_ERROR
        value: "false"
      - key: MAERSK_TIMEOUT_SECONDS
        value: "60"
      - key: MAERSK_MAX_RETRIES
        value: "2"
      - key: MAERSK_RETRY_DELAY_SECONDS
        value: "2"
      - key: MSC_USE_PLAYWRIGHT
        value: "true"
      - key: MSC_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: MSC_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: MSC_PLAYWRIGHT_CHANNEL
        value: ""
      - key: MSC_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_USE_PLAYWRIGHT
        value: "true"
      - key: HAPAG_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: HAPAG_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: HAPAG_PLAYWRIGHT_CHANNEL
        value: ""
      - key: HAPAG_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: HAPAG_PLAYWRIGHT_VIEW
        value: "S8510"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_TIMEOUT_SECONDS
        value: "45"
      - key: HAPAG_PLAYWRIGHT_CHALLENGE_RELOAD_ATTEMPTS
        value: "2"
      - key: HAPAG_PLAYWRIGHT_WARMUP_SECONDS
        value: "6"
      - key: WAN_HAI_USE_PLAYWRIGHT
        value: "true"
      - key: WAN_HAI_PLAYWRIGHT_REQUIRED
        value: "false"
      - key: WAN_HAI_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: WAN_HAI_PLAYWRIGHT_CHANNEL
        value: ""
      - key: WAN_HAI_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: CMA_CGM_USE_PLAYWRIGHT
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_REQUIRED
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_BROWSER
        value: "chromium"
      - key: CMA_CGM_PLAYWRIGHT_CHANNEL
        value: ""
      - key: CMA_CGM_PLAYWRIGHT_HEADLESS
        value: "true"
      - key: CMA_CGM_PLAYWRIGHT_WARMUP_URL
        value: https://www.cma-cgm.com/ebusiness/tracking
      - key: CMA_CGM_PLAYWRIGHT_WAIT_SECONDS
        value: "8"
